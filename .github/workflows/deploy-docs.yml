name: Build and Deploy Docs

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 0 * * 0'  # 每周日凌晨自动构建
  workflow_dispatch:       # 手动触发

# Pages 部署权限
permissions:
  pages: write
  id-token: write

# 防止并发部署冲突
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install doc build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            openjade opensp docbook-dsssl \
            docbook-xsl xsltproc docbook-xml \
            lynx perl autoconf automake libtool \
            build-essential libpq-dev

      - name: Generate configure script
        run: autoreconf -i

      - name: Configure
        run: ./configure

      - name: Build HTML docs
        run: make -C doc/src/sgml html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc/src/sgml/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
