name: Build and Deploy Docs

on:
  push:
    branches: [master, chinese-docs]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install doc build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            openjade opensp docbook-dsssl \
            docbook-xsl xsltproc docbook-xml \
            docbook \
            lynx perl autoconf automake libtool \
            build-essential libpq-dev

      - name: Generate configure script
        run: autoreconf -i

      - name: Configure
        run: ./configure

      - name: Build English HTML docs
        run: make -C doc/src/sgml html

      - name: Build Chinese HTML docs
        if: github.ref == 'refs/heads/chinese-docs'
        run: make -C doc-zh/src/sgml html

      - name: Organize docs for deployment
        run: |
          mkdir -p _pages/zh
          cp -r doc/src/sgml/html/* _pages/
          if [ -d doc-zh/src/sgml/html ]; then
            cp -r doc-zh/src/sgml/html/* _pages/zh/
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
