name: Build and Deploy Docs

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install doc build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            openjade opensp docbook-dsssl \
            docbook-xsl xsltproc docbook-xml \
            docbook \
            lynx perl autoconf automake libtool \
            build-essential libpq-dev

      - name: Debug - check SGML catalog
        run: |
          echo "=== SGML catalog ==="
          cat /etc/sgml/catalog 2>/dev/null || echo "No /etc/sgml/catalog"
          echo ""
          echo "=== DocBook DTD location ==="
          find /usr/share/sgml/docbook -name "*.dtd" -o -name "*.cat" 2>/dev/null | head -10
          echo ""
          echo "=== nsgmls test ==="
          echo '<!doctype book PUBLIC "-//OASIS//DTD DocBook V4.2//EN"><book><title>t</title><chapter><title>c</title><para>t</para></chapter></book>' | onsgmls -s -

      - name: Generate configure script
        run: autoreconf -i

      - name: Configure
        run: ./configure

      - name: Build HTML docs
        run: make -C doc/src/sgml html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc/src/sgml/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
