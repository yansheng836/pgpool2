name: Build and Deploy Docs

on:
  push:
    branches: [master, chinese-docs]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install doc build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            openjade opensp docbook-dsssl \
            docbook-xsl xsltproc docbook-xml \
            docbook \
            lynx perl autoconf automake libtool \
            build-essential libpq-dev

      - name: Generate configure script
        run: autoreconf -i

      - name: Configure
        run: ./configure

      - name: Build English HTML docs
        run: make -C doc/src/sgml html

      - name: Build Chinese HTML docs
        if: github.ref == 'refs/heads/chinese-docs'
        run: |
          make -C doc-zh/src/sgml html VERBOSE=1 2>&1 || true
          echo "=== Checking Chinese HTML output ==="
          find doc-zh/src/sgml -name "*.html" -type f 2>/dev/null | head -10
          echo "Total HTML files: $(find doc-zh/src/sgml -name '*.html' -type f 2>/dev/null | wc -l)"
          ls -la doc-zh/src/sgml/html/ 2>/dev/null || echo "html/ dir does not exist"

      - name: Organize docs for deployment
        run: |
          mkdir -p _pages/zh
          cp -r doc/src/sgml/html/* _pages/ 2>/dev/null || true
          ZH_HTML=$(find doc-zh/src/sgml -name "*.html" -type f 2>/dev/null)
          if [ -n "$ZH_HTML" ]; then
            echo "Found Chinese HTML files"
            echo "$ZH_HTML" | head -5
            mkdir -p _pages/zh
            cp doc-zh/src/sgml/html/*.html _pages/zh/ 2>/dev/null || true
            cp doc-zh/src/sgml/*.html _pages/zh/ 2>/dev/null || true
            cp doc-zh/src/sgml/stylesheet.css _pages/zh/ 2>/dev/null || true
            find doc-zh/src -name "*.gif" -exec cp {} _pages/zh/ \; 2>/dev/null || true
          else
            echo "NO Chinese HTML files found"
          fi
          ls _pages/zh/ 2>/dev/null | head -10

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_pages
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
